<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办事项</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #e8f4ff 0%, #f2f3f5 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .todo {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(64, 150, 255, .12);
      padding: 24px;
      align-self: flex-start;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 18px;
      color: #1f2d3d;
    }
    .input-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    #input {
      flex: 1;
      min-width: 140px;
      padding: 10px 12px;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color .2s;
    }
    #input:focus { border-color: #4096ff; }
    #date {
      padding: 10px 12px;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      color: #555;
      background: #fff;
    }
    button.add {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #4096ff;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      transition: background .2s;
    }
    button.add:hover { background: #1677ff; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    button.op {
      flex: 1;
      min-width: 90px;
      padding: 9px 12px;
      border: 1px solid #4096ff;
      border-radius: 8px;
      background: #fff;
      color: #4096ff;
      font-size: 14px;
      cursor: pointer;
      transition: background .2s;
    }
    button.op:hover { background: #e6f4ff; }

    ul { list-style: none; margin-top: 18px; }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 4px;
      border-bottom: 1px solid #f0f0f0;
    }
    li:last-child { border-bottom: none; }
    li input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    li .text { flex: 1; font-size: 15px; word-break: break-all; color: #1f2d3d; }
    li .date {
      font-size: 12px;
      color: #888;
      white-space: nowrap;
      background: #f2f6fc;
      border-radius: 6px;
      padding: 3px 8px;
    }
    li.done .text { text-decoration: line-through; color: #999; }
    button.del {
      border: none;
      background: transparent;
      color: #ff4d4f;
      font-size: 14px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }
    button.del:hover { background: #fff1f0; }

    .stats {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }
    .stat {
      flex: 1;
      text-align: center;
      background: #f7faff;
      border-radius: 10px;
      padding: 12px 0;
    }
    .stat .num { font-size: 20px; font-weight: 600; color: #4096ff; }
    .stat .label { font-size: 12px; color: #888; margin-top: 2px; }
    .empty { text-align: center; color: #bbb; padding: 28px 0; }
  </style>
</head>
<body>
  <div class="todo">
    <h1>待办事项</h1>
    <div class="input-row">
      <input id="input" type="text" placeholder="输入要做的事，回车添加">
      <input id="date" type="date">
      <button class="add" onclick="addTodo()">添加</button>
    </div>
    <div class="btn-row">
      <button class="op" onclick="allComplete()">全部完成</button>
      <button class="op" onclick="toggleSort()">排序↑↓</button>
      <button class="op" onclick="clearAll()">全部删除</button>
    </div>

    <ul id="list"></ul>

    <div class="stats" id="stats"></div>
  </div>

  <script>
    let todos = JSON.parse(localStorage.getItem('todos') || '[]');
    let sortAsc = true;

    const input = document.getElementById('input');
    const dateInput = document.getElementById('date');
    const list = document.getElementById('list');
    const stats = document.getElementById('stats');

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') addTodo();
    });

    function save() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    function addTodo() {
      const text = input.value.trim();
      const dateVal = dateInput.value;
      if (!text) return;
      todos.push({ id: Date.now(), text: text, date: dateVal || '', done: false });
      input.value = '';
      dateInput.value = '';
      save();
      render();
    }

    function toggle(index) {
      todos[index].done = !todos[index].done;
      save();
      render();
    }

    function del(index) {
      todos.splice(index, 1);
      save();
      render();
    }

    function allComplete() {
      todos.forEach(item => { item.done = true; });
      save();
      render();
    }

    function toggleSort() {
      if (sortAsc) {
        todos.sort((a, b) => a.id - b.id);
      } else {
        todos.sort((a, b) => b.id - a.id);
      }
      sortAsc = !sortAsc;
      save();
      render();
    }

    function clearAll() {
      if (todos.length === 0) return;
      if (confirm('确定要清空全部待办事项吗？')) {
        todos = [];
        save();
        render();
      }
    }

    function render() {
      list.innerHTML = '';
      if (todos.length === 0) {
        list.innerHTML = '<li class="empty">暂无待办事项</li>';
      } else {
        todos.forEach((t, i) => {
          const li = document.createElement('li');
          if (t.done) li.className = 'done';

          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = t.done;
          cb.onclick = () => toggle(i);

          const span = document.createElement('span');
          span.className = 'text';
          span.textContent = t.text;

          const dateSpan = document.createElement('span');
          dateSpan.className = 'date';
          dateSpan.textContent = t.date ? t.date : '';

          const btn = document.createElement('button');
          btn.className = 'del';
          btn.textContent = '删除';
          btn.onclick = () => del(i);

          li.appendChild(cb);
          li.appendChild(span);
          li.appendChild(dateSpan);
          li.appendChild(btn);
          list.appendChild(li);
        });
      }

      const total = todos.length;
      const doneCount = todos.filter(t => t.done).length;
      const activeCount = total - doneCount;
      stats.innerHTML =
        '<div class="stat"><div class="num">' + total + '</div><div class="label">全部</div></div>' +
        '<div class="stat"><div class="num">' + activeCount + '</div><div class="label">进行中</div></div>' +
        '<div class="stat"><div class="num">' + doneCount + '</div><div class="label">已完成</div></div>';
    }

    render();
  </script>
</body>
</html>
